    - Memory: reference/memory.md
    - Connections: reference/connections.md
    - Security: reference/security.md
    - Agentic Workflows: reference/agentic-workflows.md
    - Agent vs Workflow: reference/agent-vs-workflow.md
    - Observability: reference/observability.md
    - Control Plane: reference/control-plane.md
    - Channels: reference/channels.md
    - Voice: reference/voice.md
    - Evaluation: reference/evaluation.md
    - Optimization: reference/optimization.md
    - Roadmap:
